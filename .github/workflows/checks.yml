name: SDK-free checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-core:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Audit tracked source
        run: python tools/check_source_tree.py
      - name: Validate version metadata
        run: python native/generate_version.py
      - name: Build the pinned engine
        run: ./build.ps1
      - name: Build and run native core checks without the Adobe SDK
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cmake = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          & $cmake -S native/tests -B native/build/tests -A x64
          if ($LASTEXITCODE) { throw 'Test configuration failed.' }
          & $cmake --build native/build/tests --config Release
          if ($LASTEXITCODE) { throw 'Test compilation failed.' }
          Copy-Item build/engine/Release/nfp_nest.dll native/build/tests/Release/
          & ./native/build/tests/Release/NestNativeChecks.exe
          if ($LASTEXITCODE) { throw 'Native checks failed.' }
      - name: Independent geometry checks
        run: |
          python -m pip install --target build/test-deps -r requirements-test.txt
          if ($LASTEXITCODE) { throw 'Test dependency installation failed.' }
          python native/tests/test_multisheet.py
          if ($LASTEXITCODE) { throw 'Multi-sheet checks failed.' }
          python native/tests/test_sheets.py
          if ($LASTEXITCODE) { throw 'Irregular-sheet checks failed.' }
          python native/tests/test_holes.py
          if ($LASTEXITCODE) { throw 'Compound-path checks failed.' }
          python native/tests/test_labels.py
          if ($LASTEXITCODE) { throw 'Label checks failed.' }
